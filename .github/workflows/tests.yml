name: Tests

on: [ push, pull_request, workflow_dispatch ]

jobs:
  test:
    strategy:
      # Default value means that a failure in one OS cancels all 
      fail-fast: false
      matrix:
        smalltalk: [ Pharo64-15 ]
        os: [ windows-latest ]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.smalltalk }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup smalltalkCI
        uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - name: Set the git identity used by the tests to commit
        run: |
          git config --global user.email "rita-tests@example.org"
          git config --global user.name "Rita Tests"
        shell: bash
      - name: Load in New Image and Run Tests
        run: smalltalkci -s ${{ matrix.smalltalk }} .ci.ston
        shell: bash
        timeout-minutes: 10
